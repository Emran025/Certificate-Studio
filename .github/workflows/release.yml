name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional release tag used to label a non-publishing preview, e.g. v0.0.5.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            target: linux
          - platform: windows
            os: windows-latest
            target: windows
          - platform: macos
            os: macos-latest
            target: macos
          - platform: android
            os: ubuntu-latest
            target: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python crypto package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest
        working-directory: python/certificate_crypto
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      - name: Check formatting
        shell: bash
        run: |
          changed=()
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            diff_command=(git diff --name-only --diff-filter=ACMRTUXB HEAD^ HEAD --)
          else
            diff_command=(git diff-tree --no-commit-id --name-only --diff-filter=ACMRTUXB -r --root HEAD --)
          fi
          while IFS= read -r path; do
            changed+=("$path")
          done < <("${diff_command[@]}" 'lib/**/*.dart' 'test/**/*.dart')
          if [ "${#changed[@]}" -gt 0 ]; then
            dart format --output=none --set-exit-if-changed "${changed[@]}"
          else
            echo "No Dart files changed in this commit."
          fi
      - run: flutter analyze
      # Keep the same Unicode/OpenType shaping path used by the released app.
      - run: flutter test --dart-define=use_arabic=true

      - if: matrix.target == 'linux'
        name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - if: matrix.target != 'linux' && matrix.target != 'android'
        name: Install Flutter desktop prerequisites (non-Linux)
        shell: bash
        run: echo "No extra prerequisites needed for ${{ matrix.target }}"

      - if: matrix.target != 'android'
        run: flutter config --enable-${{ matrix.target }}-desktop
      - if: matrix.target != 'android'
        run: flutter build ${{ matrix.target }} --release --dart-define=use_arabic=true
      - if: matrix.target == 'android'
        run: flutter build apk --release --dart-define=use_arabic=true
      - if: matrix.target == 'android'
        name: Package Android APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "certificate-studio-android-${RELEASE_VERSION}.apk"

      - name: Package Linux
        if: matrix.target == 'linux'
        shell: bash
        run: |
          mkdir -p CertificateStudio.AppDir/usr/bin
          cp -a build/linux/x64/release/bundle/. CertificateStudio.AppDir/usr/bin/
          cp assets/images/certificate_studio_logo.png CertificateStudio.AppDir/certificate-studio.png
          cat > CertificateStudio.AppDir/certificate-studio.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Certificate Studio
          Exec=certificate_studio
          Icon=certificate-studio
          Categories=Office;
          Terminal=false
          EOF
          cat > CertificateStudio.AppDir/AppRun <<'EOF'
          #!/bin/sh
          exec "$(dirname "$0")/usr/bin/certificate_studio" "$@"
          EOF
          chmod +x CertificateStudio.AppDir/AppRun
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run CertificateStudio.AppDir "certificate-studio-linux-${RELEASE_VERSION}.AppImage"

          mkdir -p deb/DEBIAN deb/usr/bin
          cp -a build/linux/x64/release/bundle/. deb/usr/bin/
          package_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          package_version="${package_version%%+*}"
          if [[ "${GITHUB_REF_TYPE:-branch}" == "tag" ]]; then
            package_version="${GITHUB_REF_NAME#v}"
          fi
          cat > deb/DEBIAN/control <<EOF
          Package: certificate-studio
          Version: ${package_version}
          Section: office
          Priority: optional
          Architecture: amd64
          Maintainer: Certificate Studio
          Description: Offline-first certificate authoring and verification workspace
          EOF
          dpkg-deb --build deb "certificate-studio-linux-${RELEASE_VERSION}.deb"
      - name: Install Windows installer tool
        if: matrix.target == 'windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Package Windows installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          & scripts/windows/package-installer.ps1 -AppVersion $env:RELEASE_VERSION -OutputBaseFilename "certificate-studio-windows-$($env:RELEASE_VERSION)-setup"
      - name: Package macOS
        if: matrix.target == 'macos'
        run: |
          hdiutil create \
            -volname "Certificate Studio" \
            -srcfolder build/macos/Build/Products/Release/certificate_studio.app \
            -ov \
            -format UDZO \
            "certificate-studio-macos-${RELEASE_VERSION}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: certificate-studio-${{ matrix.platform }}
          path: |
            *.AppImage
            *.deb
            *.dmg
            *.exe
            *.apk

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
