name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python crypto package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest
        working-directory: python/certificate_crypto
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      - name: Check formatting
        shell: bash
        run: |
          changed=()
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            diff_command=(git diff --name-only HEAD^ HEAD --)
          else
            diff_command=(git diff-tree --no-commit-id --name-only --diff-filter=ACMRTUXB -r --root HEAD --)
          fi
          while IFS= read -r path; do
            changed+=("$path")
          done < <("${diff_command[@]}" 'lib/**/*.dart' 'test/**/*.dart')
          if [ "${#changed[@]}" -gt 0 ]; then
            dart format --output=none --set-exit-if-changed "${changed[@]}"
          else
            echo "No Dart files changed in this commit."
          fi
      - run: flutter analyze
      - run: flutter test

  desktop-build:
    name: Build Linux desktop app
    needs: editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - run: flutter config --enable-linux-desktop
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: certificate-studio-linux
          path: build/linux/x64/release/bundle
