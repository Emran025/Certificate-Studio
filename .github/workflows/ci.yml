name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      - name: Check formatting
        shell: bash
        run: |
          changed=()
          while IFS= read -r path; do
            changed+=("$path")
          done < <(git diff-tree --no-commit-id --name-only --diff-filter=ACMRTUXB -r --root HEAD -- 'lib/**/*.dart' 'test/**/*.dart')
          if [ "${#changed[@]}" -gt 0 ]; then
            dart format --output=none --set-exit-if-changed "${changed[@]}"
          else
            echo "No Dart files changed in this commit."
          fi
      - run: flutter analyze
      - run: flutter test

  desktop-build:
    name: Build Linux desktop app
    needs: editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - run: flutter config --enable-linux-desktop
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: certificate-studio-linux
          path: build/linux/x64/release/bundle
