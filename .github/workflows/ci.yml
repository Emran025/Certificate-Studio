name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    name: Analyze and test Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python crypto package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest
        working-directory: python/certificate_crypto
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      - name: Check formatting
        shell: bash
        run: |
          changed=()
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            diff_command=(git diff --name-only --diff-filter=ACMRTUXB HEAD^ HEAD --)
          else
            diff_command=(git diff-tree --no-commit-id --name-only --diff-filter=ACMRTUXB -r --root HEAD --)
          fi
          while IFS= read -r path; do
            changed+=("$path")
          done < <("${diff_command[@]}" 'lib/**/*.dart' 'test/**/*.dart' 'tool/**/*.dart')
          if [ "${#changed[@]}" -gt 0 ]; then
            dart format --output=none --set-exit-if-changed "${changed[@]}"
          else
            echo "No Dart files changed in this commit."
          fi
      - run: flutter analyze
      # pdf enables its Arabic/OpenType shaping path through this compile-time
      # flag. It preserves source Unicode and does not alter field geometry.
      - run: flutter test --dart-define=use_arabic=true

  desktop-build:
    name: Build Linux desktop app
    needs: editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - run: flutter config --enable-linux-desktop
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=use_arabic=true
      - uses: actions/upload-artifact@v4
        with:
          name: certificate-studio-linux
          path: build/linux/x64/release/bundle

  windows-generation-smoke:
    name: Build and test Windows Release installer
    needs: editor
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Build release-mode generation smoke app
        run: flutter build windows --release --target=tool/windows_generation_release_smoke.dart --dart-define=use_arabic=true
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Package smoke app with the release installer script
        shell: pwsh
        run: |
          & scripts/windows/package-installer.ps1 -AppVersion 'release-smoke' -OutputBaseFilename 'certificate-studio-windows-release-smoke-setup'
      - name: Install, generate, uninstall, and verify retained user data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appData = Join-Path $env:APPDATA 'com.example\certificate_studio'
          New-Item -ItemType Directory -Path $appData -Force | Out-Null
          $databaseSentinel = Join-Path $appData 'certificate_studio.sqlcipher.db'
          $keySentinel = Join-Path $appData 'flutter_secure_storage.dat'
          $preferencesFile = Join-Path $appData 'shared_preferences.json'
          Set-Content -Path $databaseSentinel -Value 'preserve-database' -NoNewline
          Set-Content -Path $keySentinel -Value 'preserve-key' -NoNewline

          $setup = Join-Path $env:GITHUB_WORKSPACE 'certificate-studio-windows-release-smoke-setup.exe'
          $installDir = Join-Path $env:ProgramFiles 'Certificate Studio'
          $app = Join-Path $installDir 'certificate_studio.exe'
          $uninstaller = Join-Path $installDir 'unins000.exe'

          function Install-SmokeApp {
            & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
            if ($LASTEXITCODE -ne 0) { throw "Setup install failed: $LASTEXITCODE" }
            if (-not (Test-Path $app)) { throw 'Installed app executable was not found.' }
          }

          function Assert-UserDataPreserved {
            param([switch] $ExpectArtifacts, [string] $ExpectedPreferencesHash)
            foreach ($path in @($databaseSentinel, $keySentinel)) {
              if (-not (Test-Path $path)) { throw "User data was removed: $path" }
            }
            if ($ExpectArtifacts -and -not (Test-Path $preferencesFile)) {
              throw "Generated certificate artifacts were removed: $preferencesFile"
            }
            if ($ExpectedPreferencesHash) {
              $actualHash = (Get-FileHash -Path $preferencesFile -Algorithm SHA256).Hash
              if ($actualHash -ne $ExpectedPreferencesHash) {
                throw 'The installer changed generated certificate artifacts in AppData.'
              }
            }
          }

          function Run-GenerationSmoke([int] $iteration) {
            $report = Join-Path $env:RUNNER_TEMP "certificate-generation-smoke-$iteration.json"
            Remove-Item $report -Force -ErrorAction SilentlyContinue
            $env:CERTIFICATE_STUDIO_SMOKE_REPORT = $report
            $process = Start-Process -FilePath $app -PassThru -Wait
            if (-not (Test-Path $report)) {
              throw "Smoke app did not write its report (exit $($process.ExitCode))."
            }
            $json = Get-Content -Path $report -Raw
            Write-Host $json
            $result = $json | ConvertFrom-Json
            if ($process.ExitCode -ne 0 -or -not $result.passed) {
              throw "Certificate generation failed in release mode: $json"
            }
            if (-not $result.releaseMode) { throw 'The smoke executable was not built in Release mode.' }
            if ($result.expected -ne 9 -or $result.generated -ne 9 -or $result.failed -ne 0) {
              throw "Expected nine successful certificates: $json"
            }
          }

          Install-SmokeApp
          Assert-UserDataPreserved
          Run-GenerationSmoke 1
          Assert-UserDataPreserved -ExpectArtifacts
          $firstPreferencesHash = (Get-FileHash -Path $preferencesFile -Algorithm SHA256).Hash
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstall failed: $LASTEXITCODE" }
          Assert-UserDataPreserved -ExpectArtifacts -ExpectedPreferencesHash $firstPreferencesHash

          Install-SmokeApp
          Assert-UserDataPreserved -ExpectArtifacts -ExpectedPreferencesHash $firstPreferencesHash
          Run-GenerationSmoke 2
          Assert-UserDataPreserved -ExpectArtifacts
          $secondPreferencesHash = (Get-FileHash -Path $preferencesFile -Algorithm SHA256).Hash
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Second uninstall failed: $LASTEXITCODE" }
          Assert-UserDataPreserved -ExpectArtifacts -ExpectedPreferencesHash $secondPreferencesHash
