[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "certificate-crypto"
version = "1.0.0"
description = "Reference cryptographic implementation for Certificate Studio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Certificate Studio" }]
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/certificate_crypto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
