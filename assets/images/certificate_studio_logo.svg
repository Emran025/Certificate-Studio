<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.5" stop-color="#646a72"/>
      <stop offset="1" stop-color="#292e35"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f959d"/>
      <stop offset="1" stop-color="#30353c"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8f9"/>
      <stop offset="1" stop-color="#cdd2d7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#11151a" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#11151a" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Document -->
  <g filter="url(#shadow)">
    <path d="M262 178
             C238 178 218 198 218 222
             V696
             C218 720 238 740 262 740
             H735
             V328
             L585 178
             Z" fill="url(#paper)"/>

    <!-- folded corner -->
    <path d="M585 178 V296
             C585 314 600 328 618 328
             H735 Z" fill="#565c63"/>
    <path d="M607 178 H735 V306
             Z" fill="url(#fold)"/>

    <!-- document lines -->
    <rect x="282" y="360" width="370" height="44" rx="22" fill="#626870"/>
    <rect x="282" y="447" width="290" height="44" rx="22" fill="#626870"/>
  </g>

  <!-- Verification badge -->
  <g filter="url(#soft)">
    <circle cx="716" cy="700" r="176" fill="#6f757d"/>
    <circle cx="716" cy="700" r="158" fill="#f8f9fa"/>
    <circle cx="716" cy="700" r="132" fill="url(#badge)"/>

    <!-- check mark -->
    <path d="M642 700 L691 749 L796 636" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>